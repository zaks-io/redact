name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Cargo package version to prepare, without a v prefix
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  candidate:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Validate release candidate
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          test "$GITHUB_REF" = refs/heads/main
          python3 - <<'PY'
          import os, sys, tomllib
          sys.path.insert(0, "scripts")
          from release_packages import version
          expected = tomllib.load(open("Cargo.toml", "rb"))["package"]["version"]
          try:
              supplied = version(os.environ["RELEASE_VERSION"])
              if supplied != expected:
                  raise ValueError
          except Exception:
              sys.exit("release: select main and use its Cargo package version")
          PY

  checks:
    needs: candidate
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml
    with:
      package: true

  draft:
    needs: checks
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: prepared-release
          path: target/release-assets
          digest-mismatch: error
      - name: Prepare and verify an unpublished draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          draft_url=$(python3 scripts/release.py draft --asset-dir target/release-assets \
            --version "$RELEASE_VERSION" --source-sha "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID")
          printf 'Draft ready for review: %s\n' "$draft_url" >> "$GITHUB_STEP_SUMMARY"
