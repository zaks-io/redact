[graph]
all-features = true

[advisories]
version = 2

[licenses]
version = 2
allow = ["MIT", "Apache-2.0", "Unicode-3.0"]
confidence-threshold = 0.95
exceptions = [{ name = "libfuzzer-sys", version = "=0.4.10", allow = ["NCSA"] }]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
