[package]
name = "redact"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
description = "Local secret-safe environment inspection and stdin filtering"

[dependencies]
base64 = "0.22.1"
clap = { version = "4.5", features = ["derive"] }
percent-encoding = "2.3"
regex = "1.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10.9"

[dev-dependencies]
proptest = "1.9"
tempfile = "3.23"

[profile.release]
lto = "thin"
strip = true
