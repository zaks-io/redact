[package]
name = "redact"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "Secret-safe environment inspection and stdin redaction"
license = "MIT"
publish = false

[[example]]
name = "entropy_eval"
path = "examples/entropy_eval/main.rs"
test = true

[dependencies]
base64 = "0.22.1"
# CLI errors use fixed diagnostics, and help is rendered as plain text.
clap = { version = "4.6.1", default-features = false, features = ["derive", "std", "help", "usage"] }
percent-encoding = "2.3"
# Retain Unicode boundaries, categories and case folding used by bundled detectors.
# Standalone release acceptance checks this set; test dependencies enable extra tables.
regex = { version = "1.12.2", default-features = false, features = ["std", "perf", "unicode-bool", "unicode-case", "unicode-gencat", "unicode-perl"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.145", features = ["arbitrary_precision"] }
sha2 = "0.10.9"

[dev-dependencies]
libc = "0.2.177"
proptest = "1.9.0"
tempfile = "3.23.0"
wait-timeout = "0.2.1"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"


# Release settings follow docs/binary-optimization.md.
[profile.release]
strip = true
lto = "fat"
codegen-units = 1
