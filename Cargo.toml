[package]
name = "redact"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "Secret-safe environment inspection and stdin redaction"
license = "MIT"
publish = false

[dependencies]
base64 = "0.22.1"
clap = { version = "4.6.1", features = ["derive"] }
regex = "1.12.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.145", features = ["arbitrary_precision"] }
sha2 = "0.10.9"

[dev-dependencies]
libc = "0.2.177"
proptest = "1.9.0"
tempfile = "3.23.0"
wait-timeout = "0.2.1"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

